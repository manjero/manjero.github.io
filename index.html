<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>רובוטיקה ו׳–ח׳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a classroom "night-sky" deck — navy home grid of lesson cards per unit; each lesson is a 16:9 slide stage scaled to the screen with a floating control pill. Single dark theme by design (matches the grades 3–5 sister site). */
:root{
  --navy:#1b2547; --navy-2:#24315c; --navy-3:#2f3e70; --ink:#141b36;
  --cream:#f6efe1; --cream-2:#ebe1cc; --paper-ink:#1d2546; --paper-mute:#5b6283;
  --sun:#f2b84b; --coral:#e36b5d; --teal:#4fb3a4; --sky:#8fc8e8; --violet:#9b8be0;
  --fg:#f4f1ea; --mute:#aab3d6; --line:rgba(170,179,214,.22);
  --f-display:"Rubik","Heebo",system-ui,sans-serif;
  --f-body:"Heebo","Rubik",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--navy);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- HOME ---------- */
#home{max-width:1180px;margin:0 auto;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.badge{width:104px;height:104px;border-radius:24px;background:var(--cream);display:grid;place-items:center;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.badge svg{width:76px;height:76px}
.hero-txt{flex:1;min-width:0}
.hero h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,6vw,54px);line-height:1.05;margin:0 0 8px;color:var(--sun);text-wrap:balance}
.hero p{margin:0;color:var(--fg);font-size:clamp(15px,2.2vw,19px)}
.hero .credit{color:var(--mute);font-size:14px;margin-top:6px}
.dots{display:flex;gap:10px;margin-inline-start:auto}
.dots i{width:22px;height:22px;border-radius:50%;display:block}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 8px}
.chip{border:1.5px solid var(--line);background:var(--navy-2);border-radius:999px;padding:8px 16px;font-family:var(--f-display);font-weight:700;font-size:15px;text-decoration:none;color:var(--fg);transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--sun);background:var(--navy-3)}
.chip b{color:var(--sun)}
.unit{margin-top:44px;scroll-margin-top:20px}
.unit-h{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.unit-num{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:30px;color:var(--ink);flex:none}
.unit-h small{display:block;font-family:var(--f-display);font-weight:700;letter-spacing:.04em;font-size:14px}
.unit-h h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,4vw,36px);line-height:1.1}
.unit-h p{margin:2px 0 0;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
@media (max-width:1060px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
.card{display:flex;flex-direction:column;text-decoration:none;color:var(--fg);background:var(--navy-2);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;transition:transform .15s,border-color .15s}
.card:hover{transform:translateY(-3px);border-color:var(--sun)}
.card .pic{padding:14px 14px 0;background:var(--navy-3)}
.card .pic .art{width:100%;aspect-ratio:1;max-width:100%}
.card .meta{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1;background:var(--navy-2)}
.card .n{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--sun)}
.card h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(17px,2vw,20px);line-height:1.2;text-wrap:balance}
.card .en{font-size:12px;color:var(--mute);direction:ltr;text-align:right}
.card .tags{margin-top:auto;padding-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(170,179,214,.14);color:var(--mute)}
.tag.dc{background:var(--coral);color:#fff}
.foot{margin-top:56px;border-top:1px solid var(--line);padding-top:18px;color:var(--mute);font-size:13px;display:flex;flex-direction:column;gap:4px}

.art{border-radius:50%;overflow:hidden;display:block}
.art svg{display:block;width:100%;height:100%}

/* ---------- DECK ---------- */
#deck{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column}
#deck[hidden]{display:none!important}
#biv{position:absolute;inset:10px;z-index:8;background:var(--cream);color:var(--paper-ink);border-radius:20px;box-shadow:0 18px 44px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}
#biv .bih{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px 10px 18px;font-family:var(--f-display);background:var(--cream-2)}
#biv .bih b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#biv .bih button{flex:none;background:var(--navy);color:var(--fg);border:0;border-radius:12px;padding:8px 14px;cursor:pointer;font-family:var(--f-display);font-weight:700}
#bip{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:0}
#bip img{width:100%;max-width:1600px;display:block;max-width:100%;height:auto;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.bimsg{font-family:var(--f-display);font-size:18px;color:var(--paper-mute);margin:40px 0}
button.bref{border:0;cursor:pointer;transition:background .15s}
button.bref:hover{background:var(--sun)}
.t-meta .tlink{border:0;cursor:pointer;font:inherit;background:var(--navy-3);border-radius:999px;padding:5px 14px;color:var(--sun);text-decoration:none}
.t-meta .tlink:hover{background:var(--sun);color:var(--ink)}
#progress{height:4px;background:var(--navy-2);flex:none;margin-top:env(safe-area-inset-top,0px)}
#progress i{display:block;height:100%;background:var(--sun);transition:width .25s}
#stageWrap{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;top:50%;left:50%;width:1280px;height:720px;transform-origin:center center}
.bar{flex:none;display:flex;justify-content:center;padding-block:10px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.pill{display:flex;align-items:center;gap:4px;background:var(--navy-2);border:1.5px solid var(--line);border-radius:999px;padding:6px 8px;max-width:100%;min-width:0}
.pill button{background:none;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap}
.pill button:hover{background:var(--navy-3)}
.pill button.on{background:var(--navy-3);color:var(--sun)}
.pill .lbl{font-family:var(--f-display);font-weight:700;color:var(--sun);font-size:14px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:230px}
@media (max-width:1100px){.pill .lbl{display:none}}
.pill .cnt{font-variant-numeric:tabular-nums;font-family:var(--f-display);font-weight:700;padding:0 6px;direction:ltr}
.pill .arrow{font-size:20px;padding:6px 14px}
@media (max-width:640px){.pill .lbl{display:none}.pill button{padding:8px 10px;font-size:14px}}
#notes{position:absolute;top:14px;right:max(14px,env(safe-area-inset-right,0px));left:auto;width:min(620px,calc(100% - 28px));background:var(--cream);color:var(--paper-ink);border-radius:18px;padding:16px 20px 18px;box-shadow:0 18px 40px rgba(0,0,0,.4);z-index:5;max-height:calc(100% - 28px);overflow:auto}
#notes h4{margin:0 0 6px;font-family:var(--f-display);color:#2d7f72;font-size:16px}
#notes p{margin:0;font-size:16px;line-height:1.7}

/* ---------- SLIDES (fixed 1280×720 canvas) ---------- */
.slide{position:absolute;inset:0;padding:56px 72px 52px;display:flex;flex-direction:column;font-family:var(--f-body);overflow:hidden}
.slide.dark{background:var(--navy-2);color:var(--fg)}
.slide.paper{background:var(--cream);color:var(--paper-ink)}
.slide .ph{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;color:#2d7f72}
.slide.dark .ph{color:var(--teal)}
.slide .ph .min{color:var(--paper-mute);font-weight:500;font-size:16px}
.slide h2{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1.12;margin:6px 0 18px;text-wrap:balance}
.slide .cols{display:flex;gap:48px;flex:1;min-height:0}
.slide .main{flex:1.25;min-width:0;display:flex;flex-direction:column;gap:16px}
.slide .side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.slide p.lead{font-size:26px;line-height:1.5;margin:0}
.slide .big{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.35;margin:0}
.slide .cta{align-self:flex-start;background:var(--sun);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:22px;border-radius:999px;padding:10px 26px}
.vocab{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.vocab span.k{font-size:16px;color:var(--paper-mute);font-weight:700}
.vocab b{background:var(--navy);color:var(--sun);font-family:var(--f-display);font-size:20px;border-radius:12px;padding:6px 16px}
.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.qs li{font-size:27px;line-height:1.4;font-weight:500;display:flex;gap:14px;align-items:flex-start}
.qs li::before{content:"?";flex:none;width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--sun);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px;margin-top:2px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:st}
.steps li{counter-increment:st;font-size:26px;line-height:1.4;display:flex;gap:14px;align-items:flex-start;font-weight:500}
.steps li::before{content:counter(st);flex:none;width:40px;height:40px;border-radius:12px;background:var(--sun);color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:22px}
.bricks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.bricks li{font-size:28px;font-weight:700;font-family:var(--f-display);display:flex;align-items:center;gap:14px}
.bricks li i{width:34px;height:22px;border-radius:4px;position:relative;flex:none}
.bricks li i::before,.bricks li i::after{content:"";position:absolute;top:-7px;width:10px;height:7px;border-radius:2px 2px 0 0;background:inherit}
.bricks li i::before{right:5px}.bricks li i::after{left:5px}
.box{background:var(--navy);color:var(--fg);border-radius:22px;padding:20px 26px;display:flex;flex-direction:column;gap:10px;width:100%}
.box h5{margin:0;font-family:var(--f-display);font-size:20px;color:var(--sun)}
.box p,.box li{font-size:22px;margin:0;line-height:1.45}
.box ul{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.frame{border:3px dashed #2d7f72;border-radius:18px;padding:14px 22px;font-family:var(--f-display);font-weight:700;font-size:28px;color:#2d7f72;align-self:flex-start}
.slide.dark .frame{border-color:var(--teal);color:var(--teal)}
.bref{display:inline-flex;align-items:center;gap:10px;background:var(--cream-2);border-radius:14px;padding:8px 16px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--paper-ink)}
.bref .lbl2{color:var(--paper-mute);font-weight:500}
.logo-corner{position:absolute;bottom:22px;left:26px;width:58px;height:58px;border-radius:14px;background:var(--cream);display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.slide.paper .logo-corner{background:#fff}
.logo-corner svg{width:42px;height:42px}
.foot-credit{position:absolute;bottom:26px;right:72px;left:110px;font-size:14px;color:var(--mute);text-align:right}

/* title slide */
.t-tag{display:inline-flex;align-items:center;gap:12px}
.t-tag b{background:var(--sun);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:22px;border-radius:999px;padding:6px 18px}
.t-tag span{color:var(--teal);font-family:var(--f-display);font-weight:700;font-size:20px}
.t-title{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;color:var(--sun);margin:18px 0 18px;text-wrap:balance}
.t-q{font-size:36px;font-weight:500;line-height:1.35;margin:0 0 14px;text-wrap:balance}
.t-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:18px;color:var(--mute)}
.t-meta span{background:var(--navy-3);border-radius:999px;padding:5px 14px}
.t-en{direction:ltr;text-align:right;color:var(--mute);font-size:18px;margin-top:10px}

/* goals */
.can{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.can li{display:flex;gap:16px;align-items:center;font-size:27px;line-height:1.35;background:var(--navy-3);border-radius:18px;padding:14px 20px}
.can button.star{background:none;border:0;cursor:pointer;padding:0;flex:none;width:44px;height:44px}
.can svg{width:44px;height:44px}
.can .on path{fill:var(--sun)}

/* code */
.code{direction:ltr;text-align:left;background:#fff;border:2px solid var(--cream-2);border-radius:20px;padding:20px 22px;display:flex;flex-direction:column;gap:5px;font-family:var(--f-display);font-weight:500;font-size:19px;width:100%;overflow:hidden}
.blk{align-self:flex-start;color:#fff;border-radius:8px;padding:9px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.2;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.blk.ev{background:#f0a92b;border-radius:18px 18px 8px 8px;color:#3a2600}
.blk.ctl{background:#e8833a}
.blk.mot{background:#4a8fe0}
.blk.mot1{background:#c95fb3}
.blk.snd{background:#a05cd6}
.blk.var{background:#e0663a}
.blk.fn{background:#e85d7d}
.blk.ai{background:#2f9e8f;border-radius:18px 18px 8px 8px}
.blk .in{background:#fff;color:#222;border-radius:999px;padding:2px 10px;font-weight:700}
.blk .rp{background:rgba(255,255,255,.28);border-radius:999px;padding:2px 8px;display:inline-flex;gap:5px;align-items:center}
.blk .bo{background:rgba(0,0,0,.14);clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);padding:3px 16px;display:inline-flex;gap:5px;align-items:center;flex-wrap:wrap}
.pseudo{background:var(--navy);color:var(--fg);border-radius:20px;padding:18px 26px;list-style:none;margin:0;display:flex;flex-direction:column;gap:8px;width:100%}
.pseudo li{font-family:var(--f-display);font-weight:700;font-size:24px;display:flex;gap:12px;align-items:center}
.pseudo li::before{content:"←";color:var(--sun)}

/* PIN */
.pin{background:var(--navy);border-radius:24px;padding:24px 28px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--fg);width:100%}
.pin .url{direction:ltr;font-family:var(--f-mono);font-size:22px;color:var(--sky)}
.pin .digits{display:flex;gap:12px;direction:ltr}
.pin .digits b{width:66px;height:80px;border-radius:14px;background:var(--cream);color:var(--ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:46px}
.pin small{font-size:16px;color:var(--mute)}

/* timer */
.timer{background:var(--navy);color:var(--fg);border-radius:22px;padding:14px 20px;display:flex;align-items:center;gap:14px}
.timer .tv{font-family:var(--f-display);font-weight:800;font-size:46px;font-variant-numeric:tabular-nums;direction:ltr;min-width:136px;text-align:center}
.timer .tv.done{color:var(--coral)}
.timer button{background:var(--navy-3);border:0;border-radius:12px;padding:8px 12px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:16px}
.timer button:hover{background:var(--sun);color:var(--ink)}

/* norms */
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%}
.role{display:flex;flex-direction:column;align-items:center;gap:8px;background:#fff;border-radius:20px;padding:18px 8px}
.role svg{width:64px;height:84px}
.role span{font-family:var(--f-display);font-weight:700;font-size:18px}

/* feedback */
.fb{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1}
.fb .col{border-radius:24px;padding:24px 28px;display:flex;flex-direction:column;gap:14px}
.fb .col h3{margin:0;font-family:var(--f-display);font-size:32px}
.fb .col p{margin:0;font-size:26px;line-height:1.45;background:rgba(255,255,255,.55);border-radius:14px;padding:10px 16px}

/* flowchart */
.flow{width:100%}
.flow svg{width:100%;height:auto}

/* model panel + thumb */
.pill{flex-wrap:wrap;justify-content:center;border-radius:28px}
.pill a.pa{border-radius:999px;padding:8px 14px;font-family:var(--f-display);font-weight:700;font-size:15px;white-space:nowrap;color:var(--fg);text-decoration:none}
.pill a.pa:hover{background:var(--navy-3);color:var(--sun)}
@media (max-width:640px){.pill a.pa{padding:8px 10px;font-size:14px}}
#model{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 28px));max-height:calc(100% - 24px);background:#fff;border-radius:22px;box-shadow:0 18px 44px rgba(0,0,0,.45);z-index:6;display:flex;flex-direction:column;overflow:hidden}
#model .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 10px 16px;background:var(--cream);color:var(--paper-ink);font-family:var(--f-display)}
#model .mh button{background:var(--cream-2);border:0;border-radius:10px;width:34px;height:34px;cursor:pointer;color:var(--paper-ink);font-size:16px}
#model img{display:block;width:100%;min-height:0;flex:1;object-fit:contain;padding:14px;background:#fff}
.mthumb{background:#fff;border:2px solid var(--cream-2);border-radius:22px;padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;flex:1;min-height:0;color:var(--paper-mute)}
.mthumb:hover{border-color:var(--sun)}
.mthumb img{flex:1;min-height:0;width:100%;object-fit:contain}
.mthumb span{font-family:var(--f-display);font-weight:700;font-size:17px}
.mthumb.sm{flex:none;height:230px}

[hidden]{display:none!important}
/* slide entrance */
.slide{animation:sin .28s ease-out}
@keyframes sin{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
<main id="home" dir="rtl" lang="he"></main>
<div id="deck" dir="rtl" lang="he" hidden>
 <div id="progress"><i></i></div>
 <div id="stageWrap"><div id="stage"></div><div id="notes" hidden></div><div id="biv" hidden role="dialog" aria-label="הוראות בנייה"><div class="bih"><b id="bit"></b><button id="biclose" aria-label="סגירה">✕ סגירה</button></div><div id="bip"></div></div><div id="model" hidden><div class="mh"><b id="mt"></b><button id="mclose" aria-label="סגירת הדגם">✕</button></div><img id="mimg" alt=""></div></div>
 <div class="bar"><div class="pill">

// ---- code blocks ----
function parseBlock(s){
 let out='',i=0;
 while(i<s.length){
  const ch=s[i];
  if(ch==='['){const j=s.indexOf(']',i);out+=`<span class="in">${esc(s.slice(i+1,j))}</span>`;i=j+1;}
  else if(ch==='('){let d=1,j=i+1;while(j<s.length&&d){if(s[j]==='(')d++;else if(s[j]===')')d--;j++;}const inner=s.slice(i+1,j-1);out+=`<span class="rp">${parseBlock(inner)}</span>`;i=j;}
  else if(ch==='⟨'){out+='<span class="bo">';i++;}
  else if(ch==='⟩'){out+='</span>';i++;}
  else{let j=i;while(j<s.length&&!'[(⟨⟩'.includes(s[j]))j++;out+=esc(s.slice(i,j));i=j;}
 }
 return out;
}
const codeHTML=code=>`<div class="code">${code.map(([c,t,ind])=>`<div class="blk ${c}" style="margin-left:${ind*30}px">${parseBlock(t)}</div>`).join('')}</div>`;

 case 'predict': return `<div class="slide paper">${phase(s,l)}<h2>מנבאים</h2><div class="cols">
   <div class="main">${paras(s.p)}${qs(s.q)}${frame(s.frame)}</div>
   <div class="side" style="flex:1.15">${s.code?codeHTML(s.code):''}${s.pseudo?`<ul class="pseudo">${s.pseudo.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}${s.poses?POSES:''}</div></div>${corner}</div>`;
 case 'try': return `<div class="slide paper">${phase(s,l)}<h2>נסו בעצמכם</h2><div class="cols">
   <div class="main">${s.pre?`<p class="big">${esc(s.pre)}</p>`:''}${paras(s.p)}${qs(s.q)}${steps(s.l)}</div>
   <div class="side">${pinHTML(s.pin)}</div></div>${corner}</div>`;
 case 'check': return `<div class="slide paper">${phase(s,l)}<h2>בודקים הבנה</h2><div class="cols">
   <div class="main">${s.pre?`<p class="lead" style="font-weight:700">${esc(s.pre)}</p>`:''}${paras(s.p)}${qs(s.q)}${frame(s.frame)}<div style="margin-top:auto">${vocab(s.vocab)}</div></div>
   <div class="side" style="flex:${s.flow?1.1:.6}">${s.flow?FLOW:artHTML(l.art)}</div></div>${corner}</div>`;
 case 'elab': return `<div class="slide paper">${phase(s,l)}<h2 style="font-size:40px">${esc(s.h)}</h2><div class="cols">
   <div class="main">${paras(s.p)}${steps(s.l)}<div style="margin-top:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap">${timer(s.timer)}<span class="bref"><span class="lbl2">בזוגות · מחליפים תפקידים</span> בונים ⇄ מקודדים</span></div>${vocab(s.vocab)}</div>
   <div class="side" style="flex:.7">${artHTML(l.art)}</div></div>${corner}</div>`;
 case 'share': return `<div class="slide paper">${phase(s,l)}<h2>${esc(s.pre||'שתפו!')}</h2><div class="cols">
   <div class="main">${qs(s.q)}${frame(s.frame)}</div><div class="side" style="flex:.6">${artHTML(l.art)}</div></div>${corner}</div>`;
 case 'swk': return `<div class="slide dark">${phase(s,l)}<h2 style="color:var(--sun)">הראו מה למדתם</h2><div class="cols">
   <div class="main">${(s.p||[]).map(p=>`<p class="lead">${esc(p)}</p>`).join('')}<ul class="qs">${s.q.map(q=>`<li style="color:var(--fg)">${esc(q)}</li>`).join('')}</ul><p style="margin-top:auto;font-size:20px;color:var(--mute)">כתבו את התשובות במחברת – ואז חזרו למטרות השיעור.</p></div>
   <div class="side" style="flex:.6">${artHTML(l.art)}</div></div>${corner}</div>`;
 case 'plan': return `<div class="slide paper">${phase(s,l)}<h2>${esc(s.h)}</h2><div class="cols">
   <div class="main">${s.pre?`<p class="big" style="color:#2d7f72">${esc(s.pre)}</p>`:''}${qs(s.q)}<div style="margin-top:auto">${vocab(s.vocab)}</div></div>
   <div class="side" style="flex:.7">${artHTML(l.art)}</div></div>${corner}</div>`;
 case 'proto': return `<div class="slide paper">${phase(s,l)}<h2 style="font-size:40px">${esc(s.h)}</h2><div class="cols">
   <div class="main">${steps(s.l)}<div style="margin-top:auto">${timer(s.timer)}</div>${vocab(s.vocab)}</div>
   <div class="side">${s.pin?pinHTML(s.pin):''}${modelThumb(l,'דגם להשראה',true)}</div></div>${corner}</div>`;
 case 'feedback': return `<div class="slide paper">${phase(s,l)}<h2>תנו וקבלו משוב על האב-טיפוס!</h2><div class="fb">
   <div class="col" style="background:#ffe4b0"><h3>מציגים</h3><span style="font-size:18px;color:var(--paper-mute)">נשארים ליד האב-טיפוס ומסבירים</span>${s.pres.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
   <div class="col" style="background:#cdeee8"><h3>שגרירים</h3><span style="font-size:18px;color:var(--paper-mute)">מבקרים בקבוצות אחרות ונותנים משוב</span>${s.amb.map(p=>`<p>${esc(p)}</p>`).join('')}</div></div>${corner}</div>`;
 case 'clean': return `<div class="slide dark"><div class="cols" style="align-items:center"><div class="main">
   <div class="ph" style="color:var(--teal)">סיום</div><div class="t-title" style="font-size:80px">מסדרים!</div>
   <ol class="steps">${(l.dc?['שמרו את פרויקט ה-Coding Canvas','צלמו את האב-טיפוס ורשמו את הצעדים הבאים','החזירו חלקים פנויים לערכה','חברו את החומרה לטעינה']:['פרקו את הדגם (אם צריך)','החזירו את החלקים לערכה','חברו את החומרה לטעינה']).map(x=>`<li style="color:var(--fg)">${x}</li>`).join('')}</ol></div>
   <div class="side" style="flex:.8">${artHTML(l.art)}</div></div>${corner}<div class="foot-credit">${CREDIT}</div></div>`;
 }
 return '';
}

// ---- model image + building instructions ----
const modelSrc=l=>'models/'+l.id+'.webp';
const biURL=l=>'https://teach.legoeducation.com/en-us/computer-science/lesson/'+l.en.toLowerCase().replace(/ /g,'-')+'/building-instructions';
function modelThumb(l,cap,small){return `<button class="mthumb${small?' sm':''}" data-model="1" aria-label="הגדלת תמונת הדגם"><img src="${modelSrc(l)}" alt="${esc(l.t)} – דגם"><span>${cap} · לחצו להגדלה</span></button>`}
let showModel=false,modelFor=null;
function paintModel(){const l=cur;$('#model').hidden=!showModel;$('#mb').classList.toggle('on',showModel);
 if(showModel){$('#mimg').src=modelSrc(l);$('#mimg').alt=l.t+' – דגם';$('#mt').textContent=(l.dc?'דגם להשראה':'הדגם')+(l.build?' · הוראות בנייה '+l.build:'');}}

// ---- building-instructions viewer (PDF pages pre-rendered to images) ----
const lessonCode=l=>'C'+(100+(l.u-1)*5+l.n);
let biFor=null;
function closeBI(){$('#biv').hidden=true;biFor=null;}
const BIPAGES={"C101": 4, "C102": 4, "C103": 4, "C104": 5, "C105": 1, "C106": 6, "C107": 7, "C108": 3, "C109": 3, "C110": 1, "C111": 5, "C112": 6, "C113": 4, "C114": 4, "C115": 1, "C116": 5, "C117": 5, "C118": 3, "C119": 3, "C120": 1, "C121": 5, "C122": 5, "C123": 6, "C124": 6, "C125": 1, "C126": 5, "C127": 5, "C128": 5, "C129": 5, "C130": 1};
function openBI(){
 const l=cur;biFor=l.id;const code=lessonCode(l);
 $('#biv').hidden=false;$('#bit').textContent=(l.dc?'דף השראה':'הוראות בנייה')+' · '+l.t+(l.build?' · '+l.build:'')+' · '+code;
 const n=BIPAGES[code]||0;
 $('#bip').innerHTML=n?Array.from({length:n},(_,i)=>`<img src="bip/${code}-${i+1}.webp" alt="${code} עמוד ${i+1}" loading="${i<2?'eager':'lazy'}">`).join(''):'<p class="bimsg">אין הוראות בנייה לשיעור הזה.</p>';
 $('#bip').scrollTop=0;
}

// ---- deck state ----
let cur=null,idx=0,showNotes=false,tick=null;
try{showNotes=localStorage.getItem('notes68')==='1'}catch(e){}
const slidesOf=l=>[{k:'title'},{k:'goals'},...l.s];

function fit(){
 const w=$('#stageWrap'),st=$('#stage');
 const sc=Math.min(w.clientWidth/1280,w.clientHeight/720);
 st.style.transform=`translate(-50%,-50%) scale(${sc})`;
}
function show(){
 const l=cur,all=slidesOf(l),s=all[idx];
 clearInterval(tick);tick=null;
 $('#stage').innerHTML=slideHTML(l,s);
 $('#cnt').textContent=`${idx+1} / ${all.length}`;
 $('#lbl').textContent=`יחידה ${l.u} · שיעור ${l.n} – ${l.t}`;
 $('#progress i').style.width=((idx+1)/all.length*100)+'%';
 const n=notesFor(l,s,idx);
 $('#notes').innerHTML=`<h4>הערות למורה · שקופית ${idx+1}</h4><p>${esc(n)}</p>`;
 $('#notes').hidden=!showNotes||!n;
 $('#nb').classList.toggle('on',showNotes);
 if(modelFor!==l.id){modelFor=l.id;showModel=false;}
 $('#mbl').textContent=l.dc?'השראה':'דגם';
 $('#bil').textContent=l.dc?'דף השראה':'הוראות בנייה';if(biFor!==l.id){closeBI();}
 paintModel();
 $('#prev').disabled=idx===0;$('#next').disabled=idx===all.length-1;
 fit();
}
function go(d){const n=slidesOf(cur).length;const j=Math.max(0,Math.min(n-1,idx+d));if(j!==idx){idx=j;setHash();show();}}
function setHash(){const h='#'+cur.id+(idx?'-s'+(idx+1):'');if(location.hash!==h)history.replaceState(null,'',h);}

function route(){
 const h=location.hash.slice(1);
 const m=h.match(/^(u\d+l\d+)(?:-s(\d+))?$/);
 if(m&&byId[m[1]]){
  cur=byId[m[1]];idx=Math.max(0,Math.min(slidesOf(cur).length-1,(+m[2]||1)-1));
  $('#home').hidden=true;$('#deck').hidden=false;document.title=cur.t+' · רובוטיקה ו׳–ח׳';show();
 }else{
  $('#deck').hidden=true;$('#home').hidden=false;document.title='רובוטיקה ו׳–ח׳';clearInterval(tick);
  const u=h.match(/^unit(\d)$/);if(u){const el=document.getElementById(h);el&&el.scrollIntoView();}
  else if(!h||h==='home')window.scrollTo(0,0);
 }
}

// ---- events ----
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='next')go(1);else if(b.id==='prev')go(-1);
 else if(b.id==='homeb'){const u=cur?cur.u:1;location.hash='unit'+u;}
 else if(b.id==='mb'||b.dataset.model){showModel=!showModel;paintModel();}
 else if(b.id==='bi'||b.dataset.bi){$('#biv').hidden?openBI():closeBI();}
 else if(b.id==='biclose'){closeBI();}
 else if(b.id==='mclose'){showModel=false;paintModel();}
 else if(b.id==='nb'){showNotes=!showNotes;try{localStorage.setItem('notes68',showNotes?'1':'0')}catch(err){};show();}
 else if(b.id==='fs'){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(err){}}
 else if(b.classList.contains('star')){b.classList.toggle('on')}
 else if(b.dataset.t){
  const t=b.closest('.timer'),tv=t.querySelector('.tv');
  let left=+(t.dataset.left??t.dataset.min*60);
  const paint=()=>{tv.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');tv.classList.toggle('done',left<=0)};
  if(b.dataset.t==='plus'){left+=60;t.dataset.left=left;paint();}
  if(b.dataset.t==='reset'){clearInterval(tick);tick=null;left=t.dataset.min*60;t.dataset.left=left;paint();t.querySelector('[data-t=go]').textContent='הפעלה';}
  if(b.dataset.t==='go'){
   if(tick){clearInterval(tick);tick=null;b.textContent='המשך';}
   else{b.textContent='עצירה';tick=setInterval(()=>{left=Math.max(0,+(t.dataset.left??left)-1);t.dataset.left=left;paint();if(left<=0){clearInterval(tick);tick=null;b.textContent='הפעלה';}},1000);}
  }
 }
});
document.addEventListener('keydown',e=>{
 if($('#deck').hidden)return;
 if(['ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();go(1);}
 else if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();go(-1);}
 else if(e.key==='n'||e.key==='נ'){$('#nb').click();}
 else if(e.key==='m'||e.key==='צ'){$('#mb').click();}
 else if(e.key==='Escape'&&!$('#biv').hidden){closeBI();}
 else if(e.key==='Escape'&&!document.fullscreenElement){location.hash='unit'+cur.u;}
});
let tx=null;
document.addEventListener('touchstart',e=>{if(!$('#deck').hidden)tx=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50)go(dx>0?1:-1);},{passive:true});
window.addEventListener('resize',()=>{if(!$('#deck').hidden)fit()});
window.addEventListener('hashchange',route);
document.documentElement.lang='he';document.documentElement.dir='rtl';
renderHome();route();
</script>

</body></html>
